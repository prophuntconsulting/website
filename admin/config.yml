backend:
  name: github
  repo: prophuntconsulting/website
  branch: main
  auth_type: pkce
  app_id: Ov23liY4KK8VkrVfV0Pk

media_folder: "images/blog"
public_folder: "/images/blog"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "blog"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "blog/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "blog/post?slug={{slug}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "Keep under 70 characters for best SEO"

      - label: "Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "DD MMM YYYY"
        time_format: false

      - label: "Author"
        name: "author"
        widget: "string"
        default: "PROPHUNT Advisory Team"

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Market Reports", value: "market" }
          - { label: "Buyer Guides", value: "buyer" }
          - { label: "Investment", value: "investment" }
          - { label: "Legal & Docs", value: "legal" }
          - { label: "NRI Corner", value: "nri" }

      - label: "Short Excerpt"
        name: "excerpt"
        widget: "text"
        hint: "1–2 sentence summary shown on the blog listing. Keep under 160 characters."

      - label: "Cover Image"
        name: "cover"
        widget: "image"
        required: false
        hint: "Upload a cover photo (recommended: 1200×630px)"

      - label: "Content"
        name: "body"
        widget: "markdown"
        hint: "Write your full article here. Use headings, bullet points, bold text freely."
