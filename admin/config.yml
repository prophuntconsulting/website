backend:
  name: github
  repo: prophuntconsulting/website
  branch: main
  base_url: https://prophuntllp.com/api

media_folder: "images/projects"
public_folder: "/images/projects"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "properties"
    label: "Property Listings"
    label_singular: "Property"
    folder: "properties/posts"
    create: true
    slug: "{{slug}}"
    fields:

      # ── BASIC INFO ──────────────────────────────────────────
      - label: "Project Name"
        name: "title"
        widget: "string"
        hint: "e.g. Godrej River Royale"

      - label: "Developer / Builder"
        name: "developer"
        widget: "string"
        hint: "e.g. Godrej Properties"

      - label: "Location"
        name: "location"
        widget: "string"
        hint: "e.g. Baner–Hinjewadi Rd, Pune"

      - label: "Configuration"
        name: "config"
        widget: "string"
        hint: "e.g. 2 & 3 BHK or Villa Plots"

      - label: "Area"
        name: "area"
        widget: "string"
        hint: "e.g. From 1,200 sqft"

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Apartment", value: "apartment" }
          - { label: "Plot", value: "plot" }
          - { label: "Villa", value: "villa" }
          - { label: "Commercial", value: "commercial" }

      - label: "Status"
        name: "status"
        widget: "select"
        options:
          - { label: "Active / Ongoing", value: "active" }
          - { label: "Coming Soon", value: "coming-soon" }
          - { label: "Sold Out", value: "sold-out" }
        default: "active"

      - label: "RERA Number"
        name: "rera"
        widget: "string"
        required: false
        hint: "MahaRERA project registration number"

      # ── HERO IMAGES (for detail page slideshow) ─────────────
      - label: "Hero Image 1 (Main)"
        name: "hero_1"
        widget: "image"
        hint: "Primary project photo — shown on both the listing card and the detail page hero"

      - label: "Hero Image 2"
        name: "hero_2"
        widget: "image"
        required: false
        hint: "Second slide in the hero slideshow"

      - label: "Hero Image 3"
        name: "hero_3"
        widget: "image"
        required: false
        hint: "Third slide in the hero slideshow"

      - label: "Hero Caption"
        name: "hero_caption"
        widget: "string"
        required: false
        hint: "Optional caption below the hero. Leave blank to auto-generate from project name."

      # ── ALERT BAR ───────────────────────────────────────────
      - label: "Alert Bar Text"
        name: "tagline"
        widget: "string"
        required: false
        hint: "Short announcement shown in the red bar, e.g. 'New Launch | Limited Units Available'"
        default: "New Launch | Limited Units Available"

      # ── OVERVIEW ────────────────────────────────────────────
      - label: "Project Overview"
        name: "overview"
        widget: "text"
        required: false
        hint: "2–4 sentences describing the project. Shown in the overview section."

      - label: "Stat 1 — Value"
        name: "stat_1_value"
        widget: "string"
        required: false
        hint: "e.g. 7 Acres"

      - label: "Stat 1 — Label"
        name: "stat_1_label"
        widget: "string"
        required: false
        hint: "e.g. Project Area"

      - label: "Stat 2 — Value"
        name: "stat_2_value"
        widget: "string"
        required: false
        hint: "e.g. 500+"

      - label: "Stat 2 — Label"
        name: "stat_2_label"
        widget: "string"
        required: false
        hint: "e.g. Luxury Homes"

      - label: "Stat 3 — Value"
        name: "stat_3_value"
        widget: "string"
        required: false
        hint: "e.g. 28+"

      - label: "Stat 3 — Label"
        name: "stat_3_label"
        widget: "string"
        required: false
        hint: "e.g. Amenities"

      - label: "Stat 4 — Value"
        name: "stat_4_value"
        widget: "string"
        required: false
        hint: "e.g. Q4 2026"

      - label: "Stat 4 — Label"
        name: "stat_4_label"
        widget: "string"
        required: false
        hint: "e.g. Possession"

      # ── PRICING CARDS ───────────────────────────────────────
      - label: "Starting Price (₹ Lakhs)"
        name: "price"
        widget: "number"
        value_type: "float"
        hint: "Enter in Lakhs for filters — e.g. 84 for ₹84L, 265 for ₹2.65Cr. Enter 0 for Price on Request."
        default: 0

      - label: "Unit 1 — Type"
        name: "unit_1_type"
        widget: "string"
        required: false
        hint: "e.g. 2 BHK"

      - label: "Unit 1 — Area"
        name: "unit_1_area"
        widget: "string"
        required: false
        hint: "e.g. 1,200 sqft"

      - label: "Unit 1 — Price"
        name: "unit_1_price"
        widget: "string"
        required: false
        hint: "e.g. Rs 1.25 Cr* or Price on Request"

      - label: "Unit 1 — Featured (highlight this card)"
        name: "unit_1_featured"
        widget: "boolean"
        required: false
        default: false

      - label: "Unit 2 — Type"
        name: "unit_2_type"
        widget: "string"
        required: false

      - label: "Unit 2 — Area"
        name: "unit_2_area"
        widget: "string"
        required: false

      - label: "Unit 2 — Price"
        name: "unit_2_price"
        widget: "string"
        required: false

      - label: "Unit 2 — Featured"
        name: "unit_2_featured"
        widget: "boolean"
        required: false
        default: false

      - label: "Unit 3 — Type"
        name: "unit_3_type"
        widget: "string"
        required: false

      - label: "Unit 3 — Area"
        name: "unit_3_area"
        widget: "string"
        required: false

      - label: "Unit 3 — Price"
        name: "unit_3_price"
        widget: "string"
        required: false

      - label: "Unit 3 — Featured"
        name: "unit_3_featured"
        widget: "boolean"
        required: false
        default: false

      # ── AMENITIES ───────────────────────────────────────────
      - label: "Amenities"
        name: "amenities"
        widget: "list"
        required: false
        hint: "Add one amenity per line — e.g. Swimming Pool, Gymnasium, Club House"
        field:
          label: "Amenity"
          name: "amenity"
          widget: "string"

  - name: "blog"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "blog/posts"
    media_folder: "/images/blog"
    public_folder: "/images/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "blog/{{slug}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "Keep under 70 characters for best SEO"

      - label: "Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "DD MMM YYYY"
        time_format: false

      - label: "Author"
        name: "author"
        widget: "string"
        default: "PROPHUNT Advisory Team"

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Market Reports", value: "market" }
          - { label: "Buyer Guides", value: "buyer" }
          - { label: "Investment", value: "investment" }
          - { label: "Legal & Docs", value: "legal" }
          - { label: "NRI Corner", value: "nri" }

      - label: "Short Excerpt"
        name: "excerpt"
        widget: "text"
        hint: "1–2 sentence summary shown on the blog listing. Keep under 160 characters."

      - label: "Cover Image"
        name: "cover"
        widget: "image"
        required: false
        hint: "Upload a cover photo (recommended: 1200×630px)"

      - label: "Content"
        name: "body"
        widget: "markdown"
        hint: "Write your full article here."
