  // gtag.js (~170KB) loads after the page has finished loading so it can't compete with

    var load = function(){ var s = document.createElement('script'); s.async = true; s.src = 'https://www.googletagmanager.com/gtag/js?id=G-YR6CRE6BNN'; document.head.appendChild(s); };

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>Redirecting to Blog | PROPHUNT LLP</title>
<script>
(function () {
  var slug = new URLSearchParams(window.location.search).get('slug');
  if (!slug) {
    window.location.replace('/blog');
    return;
  }

  fetch('/blog/posts.json')
    .then(function (response) { return response.ok ? response.json() : []; })
    .then(function (posts) {
      var cleanSlug = slug.replace(/^\d{4}-\d{2}-\d{2}-/, '');
      var match = posts.find(function (post) {
        return post.slug === slug || post.slug === cleanSlug;
      });
      window.location.replace(match && match.url ? match.url : '/blog/' + encodeURIComponent(slug));
    })
    .catch(function () {
      window.location.replace('/blog/' + encodeURIComponent(slug));
    });
})();
</script>
</head>
<body>
<p>Redirecting to the blog...</p>
<script>
(function(){
  function loadVoiceWidget(){
    var s = document.createElement('script');
    s.src = 'https://voice-production-2950.up.railway.app/widget.js';
    s.setAttribute('data-site-key','av_live_cDDuYuSqRmgrarST8_gjwM3G860CAuyY');
    s.setAttribute('data-api-base','https://voice-production-2950.up.railway.app');
    s.setAttribute('data-position','bottom-right');
    s.setAttribute('data-label','Talk to us');
    document.body.appendChild(s);
  }
  // Floating chat bubble — not needed for first paint, and was previously the
  // single biggest item in the critical network path (config fetch alone took 1.5s+).
  // Now deferred until the visitor first interacts (or 20s of idle). The
  // widget ships a ~10MB orb video, so loading it on every page view cost
  // ~10MB of bandwidth on mobile before anyone had asked to talk to us.
  var voiceLoaded = false;
  function loadOnce(){
    if (voiceLoaded) return; voiceLoaded = true;
    ['scroll','pointerdown','keydown','touchstart'].forEach(function(e){ window.removeEventListener(e, loadOnce); });
    loadVoiceWidget();
  }
  ['scroll','pointerdown','keydown','touchstart'].forEach(function(e){ window.addEventListener(e, loadOnce, {passive:true, once:true}); });
  window.addEventListener('load', function(){ setTimeout(loadOnce, 20000); });
})();
</script>
</body>
