name: Sanity maintenance

# Content lives in Sanity and Vercel builds the site from it on every deploy
# (publishing in the Studio calls the Vercel deploy hook). This job covers
# the two things a publish does not:
#  1. Scheduled blog posts (backup): posts are scheduled for 09:30 IST and
#     Vercel Cron (vercel.json -> api/publish-due.js) publishes them between
#     09:30 and 10:30 IST. GitHub starts scheduled runs late (4-14 hours in
#     Nov 2026), so this repeats the same check every 15 minutes from 09:30
#     and at 15:30 IST; it deploys only if a post became due after the live
#     build, so repeat runs don't redeploy.
#  2. Backups: every Sunday, export all published content to a workflow
#     artifact (kept 90 days). No git commits.
# Needs the repository secret VERCEL_DEPLOY_HOOK (the deploy hook URL).
on:
  schedule:
    - cron: '*/15 4-6 * * *'    # 09:30 to 12:15 IST
    - cron: '0 10 * * *'        # 15:30 IST fallback
  workflow_dispatch:

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy if a scheduled post became due
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: node scripts/sanity-maintenance.js due

      - name: Export content backup (Sundays, or when run by hand)
        if: github.event_name != 'schedule' || github.event.schedule == '0 10 * * *'
        run: node scripts/sanity-maintenance.js backup sanity-backup

      - uses: actions/upload-artifact@v4
        if: hashFiles('sanity-backup/**') != ''
        with:
          name: sanity-backup-${{ github.run_id }}
          path: sanity-backup
          retention-days: 90
