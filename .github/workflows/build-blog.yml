name: Rebuild Content Indexes

on:
  push:
    paths:
      - 'blog/posts/**'
      - 'properties/posts/**'
      - 'scripts/**'
      - 'property.html'
      - 'blog/post.html'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Full build: blog + project pages, locality/location/developer/category hubs and
      # sitemap.xml. Running only part of it left the sitemap and hubs stale after a CMS edit.
      - name: Build all generated pages
        run: npm run build

      - name: Commit updated indexes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Build: update generated pages and sitemap"
