name: Rebuild Content Indexes

on:
  push:
    paths:
      - 'blog/posts/**'
      - 'properties/posts/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate blog/posts.json
        run: node scripts/build-blog.js

      - name: Generate properties/posts.json
        run: node scripts/build-properties.js

      - name: Commit updated indexes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Build: update content indexes"
          file_pattern: "blog/posts.json blog/**/index.html properties/posts.json projects/**"
