name: IndexNow ping

# After each push to main, wait for Vercel to deploy, then tell Bing (and the
# other IndexNow engines) which pages changed so they recrawl right away.
# Logic lives in scripts/indexnow-ping.js; key file is served at the site root.
on:
  push:
    branches: [main]

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wait for Vercel deployment
        run: sleep 150

      - name: Submit changed URLs to IndexNow
        run: node scripts/indexnow-ping.js
